name: Publish to PyPI

# Releases are published with PyPI Trusted Publishing (OIDC): no API token is stored in
# GitHub. See RELEASING.md for the one-time setup on PyPI / TestPyPI.
#
# - Publishing a GitHub release (tag vX.Y.Z) uploads to PyPI.
# - "Run workflow" (manual) uploads to TestPyPI by default, to rehearse a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Package index to upload to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/saccade/_version.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package version '$version' (src/saccade/_version.py)."
            exit 1
          fi
          echo "Releasing version $version"

      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Install wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the built wheel into a clean environment
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Import and run the CLI
        shell: bash
        run: |
          python -c "import saccade; print('saccade', saccade.__version__)"
          saccade --version

  publish-testpypi:
    name: Upload to TestPyPI
    needs: [build, smoke-test]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/saccade-video
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Upload to PyPI
    needs: [build, smoke-test]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/saccade-video
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
