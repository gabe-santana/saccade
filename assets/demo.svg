</tspan></text><text class="l r13" x="28" y="486" xml:space="preserve"><tspan fill="#E2E8F0">orders API and drew it on the whiteboard </tspan><tspan fill="#22D3EE">[13:05]</tspan><tspan fill="#E2E8F0">, then explained</tspan></text><text class="l r14" x="28" y="507" xml:space="preserve"><tspan fill="#E2E8F0">invalidation trade-offs when the interviewer pushed back </tspan><tspan fill="#22D3EE">[13:40]</tspan><tspan fill="#E2E8F0">.</tspan></text><text class="l r15" x="28" y="528" xml:space="preserve"><tspan fill="#FBBF24">Tokens: 11,804 in (8,960 cached) + 640 out</tspan></text>
